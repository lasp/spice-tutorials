[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spiceclub"
version = "0.1.0"
description = "Kernel download helpers for the SPICE Book Club notebooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["spiceypy>=6", "numpy", "matplotlib"]

[tool.setuptools]
packages = ["spiceclub"]
